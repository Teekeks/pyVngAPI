[project]
name = "vng_api"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "orjson>=2.01",
    "mashumaro>=3.22"
]
authors = [{name = "Lena During"}]
description = "An async API client for the game \"Von Neumann Game\" (https://neumann-probe.net)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/Teekeks/pyVngAPI.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vng_api/__init__.py"
